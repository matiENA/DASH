  - type: web
    name: dash-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        value: https://rsvajuxihvmpmrmlcbul.supabase.co
      - key: SUPABASE_KEY
        value: sb_publishable_n97mVkSclRpuv_OsseO3gg_BjR9QT3R
      - key: FRONTEND_URL
        value: https://dash-aa1f.onrender.com
      - key: NODE_ENV
        value: production
