# ==============================================================
# 🚀 RENDER BLUEPRINT — DASH FRONTEND (React 19 + Vite Static Site)
# Backend Hot RAM independiente: https://sheet-render.onrender.com
# ==============================================================
services:
  - type: static
    name: dash-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://sheet-render.onrender.com
      - key: VITE_SOCKET_URL
        value: https://sheet-render.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
