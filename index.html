<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Novedades Live | EOR</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;900&family=Zilla+Slab:wght@400;500;600;700&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'], zilla: ['Zilla Slab', 'serif'], mono: ['Roboto Mono', 'monospace'] } } } }
    </script>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* MODO CARTELERA / VISTA SÓLIDA: DESHABILITAR TOTALMENTE TODA EDICIÓN */
        .modo-cartelera .btn-card-edit,
        .modo-cartelera .btn-card-resolve,
        .modo-cartelera button[onclick*="toggleDropdownTerminalCard"],
        .modo-cartelera #btn-quick-libre,
        .modo-cartelera .mention-input-wrapper,
        .modo-cartelera #btn-fab-nueva,
        .modo-cartelera .btn-mention-remove,
        .vista-solida .btn-card-edit,
        .vista-solida .btn-card-resolve,
        .vista-solida button[onclick*="toggleDropdownTerminalCard"],
        .vista-solida #btn-quick-libre,
        .vista-solida .mention-input-wrapper,
        .vista-solida #btn-fab-nueva,
        .vista-solida .btn-mention-remove {
            display: none !important;
            pointer-events: none !important;
        }

        .modo-cartelera article,
        .vista-solida article {
            cursor: default !important;
        }

        /* ESTILOS DE HEADER Y CONTRASTE EN MODO CLARO (LIGHT MODE) */
        header {
            background-color: #ffffff !important;
        }
        .dark header {
            background-color: rgba(15, 23, 42, 0.95) !important;
        }

        #clock-argentina {
            color: #020617 !important;
        }
        .dark #clock-argentina {
            color: #ffffff !important;
        }

        /* MODO CARTELERA / VISTA SÓLIDA */
        .modo-cartelera header > div > div:not(#clock-argentina),
        .vista-solida header > div > div:not(#clock-argentina) {
            display: none !important;
        }

        .modo-cartelera header > div,
        .vista-solida header > div {
            justify-content: center !important;
            padding-top: 0.15rem !important;
            padding-bottom: 0.15rem !important;
        }

        .modo-cartelera header,
        .vista-solida header {
            padding-top: 0.35rem !important;
            padding-bottom: 0.35rem !important;
            background-color: #ffffff !important;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1) !important;
        }

        .dark.modo-cartelera header,
        .dark.vista-solida header {
            background-color: rgba(15, 23, 42, 0.96) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05) !important;
        }

        .modo-cartelera #clock-argentina,
        .vista-solida #clock-argentina {
            font-size: 2.25rem !important;
            line-height: 2.5rem !important;
            margin: 0 auto !important;
            cursor: pointer !important;
            color: #020617 !important;
        }

        .dark.modo-cartelera #clock-argentina,
        .dark.vista-solida #clock-argentina {
            color: #ffffff !important;
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden bg-slate-100/70 dark:bg-slate-950 text-slate-800 dark:text-slate-200 transition-colors duration-300 antialiased selection:bg-indigo-500 selection:text-white">

    <!-- HEADER CON DISEÑO GLASSMORPHISM -->
    <header class="glass-header bg-white/85 dark:bg-slate-900/85 px-4 sm:px-8 py-3 shadow-sm z-50 shrink-0 border-b border-slate-200/80 dark:border-slate-800/80 transition-colors duration-300 sticky top-0">
        <div class="flex flex-wrap md:flex-nowrap justify-between items-center w-full gap-4 mx-auto">
            <!-- IZQUIERDA: LOGO & TÍTULO -->
            <div class="flex items-center gap-3 shrink-0">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-md shadow-indigo-500/20 font-black text-lg">
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight text-slate-900 dark:text-white flex items-center gap-2">
                        Logística<span class="bg-indigo-100 dark:bg-indigo-950/70 text-indigo-700 dark:text-indigo-300 text-[10px] font-black uppercase px-2 py-0.5 rounded-full border border-indigo-200 dark:border-indigo-800">EOR</span>
                    </h1>
                    <p class="text-[11px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mt-0.5">Alertas & Operaciones en Tiempo Real</p>
                </div>
            </div>
            
            <!-- CENTRO: SELECTOR DE VISTA (4 TABS) -->
            <div class="flex bg-slate-200/60 dark:bg-slate-900/90 p-1 rounded-xl shadow-inner w-full md:w-auto border border-slate-300/40 dark:border-slate-800/80 shrink-0 justify-center gap-0.5">
                <button onclick="cambiarVista('todas')" id="btn-todas" class="flex-1 px-4 py-1.5 bg-white dark:bg-slate-800 text-indigo-600 dark:text-indigo-400 font-extrabold text-xs rounded-lg shadow-sm transition-all duration-200 text-center whitespace-nowrap">Todas</button>
                <button onclick="cambiarVista('archivo')" id="btn-archivo" class="flex-1 px-4 py-1.5 text-slate-500 dark:text-slate-400 font-bold text-xs hover:text-slate-700 dark:hover:text-slate-200 transition-all duration-200 text-center whitespace-nowrap">Archivo</button>
                <button onclick="cambiarVista('mis_novedades')" id="btn-mis_novedades" class="flex-1 px-4 py-1.5 text-slate-500 dark:text-slate-400 font-bold text-xs hover:text-slate-700 dark:hover:text-slate-200 transition-all duration-200 text-center whitespace-nowrap">Mis Novedades</button>
                <button onclick="cambiarVista('menciones')" id="btn-menciones" class="flex-1 px-4 py-1.5 text-slate-500 dark:text-slate-400 font-bold text-xs hover:text-slate-700 dark:hover:text-slate-200 transition-all duration-200 text-center whitespace-nowrap">@</button>
            </div>

            <!-- RELOJ DIGITAL ARGENTINA (24H - ROBOTO MONO BOLD) -->
            <div id="clock-argentina" onclick="if(typeof esModoCartelera === 'function' && esModoCartelera()) toggleCartelera()" class="px-4 py-1 font-mono font-extrabold text-2xl sm:text-3xl tracking-wider text-slate-900 dark:text-white shrink-0 select-none drop-shadow-sm flex items-center justify-center transition-transform active:scale-95 cursor-pointer" style="font-family: 'Roboto Mono', monospace; font-weight: 700;" title="Reloj Argentina 24h (En Modo Cartelera: Clic para salir)">
                --:--
            </div>

            <!-- DERECHA: ACCIONES & USUARIO -->
            <div class="flex items-center gap-2.5 shrink-0">
                <!-- SWITCH CARTELERA -->
                <button onclick="toggleCartelera()" id="btn-cartelera" class="px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800/80 text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white transition-all border border-slate-200/60 dark:border-slate-700/60 active:scale-95 shadow-sm text-xs font-extrabold flex items-center gap-1.5 cursor-pointer" title="Alternar Modo Cartelera (Deshabilita toda edición)">
                    <span id="dot-cartelera" class="w-2.5 h-2.5 rounded-full bg-slate-400"></span>
                    <span class="hidden sm:inline">Cartelera</span>
                </button>

                <button onclick="toggleDarkMode()" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800/80 text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white hover:bg-slate-200/70 dark:hover:bg-slate-700/80 transition-all focus:outline-none border border-slate-200/60 dark:border-slate-700/60 active:scale-95 shadow-sm" title="Alternar Modo Oscuro">
                    <svg id="icon-sun" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <svg id="icon-moon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>

                <div id="auth-container"></div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER QUE OCUPA EL 100% DE ALTO Y ANCHO DE PANTALLA -->
    <main id="feed-container" class="flex-1 overflow-hidden p-3 md:p-4 flex flex-col h-[calc(100vh-64px)] w-full max-w-full">
        <div class="h-full w-full flex flex-col gap-3 overflow-hidden flex-1" id="novedades-container">
            <div class="flex justify-center items-center h-40 w-full"><span class="animate-spin w-8 h-8 border-4 border-indigo-500 border-t-transparent rounded-full"></span></div>
        </div>
    </main>

    <!-- BOTÓN ACCIÓN FLOTANTE (FAB) -->
    <button id="btn-fab-nueva" onclick="abrirModalNueva()" class="fixed bottom-6 right-6 w-14 h-14 bg-gradient-to-tr from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white rounded-2xl shadow-lg shadow-indigo-600/30 flex justify-center items-center active:scale-90 transition-all duration-200 z-50 border border-indigo-400/30 group">
        <svg class="w-6 h-6 transform group-hover:rotate-90 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
    </button>

    <!-- OVERLAY SELECCIÓN / DROP ZONE DE SERVICIO AL ARRASTRAR (MET, CM, EURO, LIVIANO, PP, TDS) -->
    <div id="service-drop-overlay" ondragover="permitirDrop(event)" ondrop="cancelarDropZone(event)" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-[90] hidden flex-col justify-center items-center p-6 md:p-12 pointer-events-auto transition-all duration-200">
        <div class="w-full max-w-4xl grid grid-cols-2 md:grid-cols-3 gap-6 my-auto" ondragover="permitirDrop(event)">
            <div ondragover="permitirDrop(event)" ondragenter="destacarDropZone(this)" ondragleave="desmarcarDropZone(this)" ondrop="ejecutarDropServicio(event, 'CM')" class="service-drop-zone border-2 border-dashed border-slate-500/70 rounded-3xl p-8 md:p-12 flex items-center justify-center cursor-pointer transition-all duration-200 hover:border-cyan-400 hover:bg-cyan-500/20 hover:scale-105 shadow-xl group">
                <span class="text-3xl md:text-5xl font-black tracking-widest text-white group-hover:text-cyan-300 transition-colors">CM</span>
            </div>
            <div ondragover="permitirDrop(event)" ondragenter="destacarDropZone(this)" ondragleave="desmarcarDropZone(this)" ondrop="ejecutarDropServicio(event, 'EURO')" class="service-drop-zone border-2 border-dashed border-slate-500/70 rounded-3xl p-8 md:p-12 flex items-center justify-center cursor-pointer transition-all duration-200 hover:border-cyan-400 hover:bg-cyan-500/20 hover:scale-105 shadow-xl group">
                <span class="text-3xl md:text-5xl font-black tracking-widest text-white group-hover:text-cyan-300 transition-colors">EURO</span>
            </div>
            <div ondragover="permitirDrop(event)" ondragenter="destacarDropZone(this)" ondragleave="desmarcarDropZone(this)" ondrop="ejecutarDropServicio(event, 'MET')" class="service-drop-zone border-2 border-dashed border-slate-500/70 rounded-3xl p-8 md:p-12 flex items-center justify-center cursor-pointer transition-all duration-200 hover:border-cyan-400 hover:bg-cyan-500/20 hover:scale-105 shadow-xl group">
                <span class="text-3xl md:text-5xl font-black tracking-widest text-white group-hover:text-cyan-300 transition-colors">MET</span>
            </div>
            <div ondragover="permitirDrop(event)" ondragenter="destacarDropZone(this)" ondragleave="desmarcarDropZone(this)" ondrop="ejecutarDropServicio(event, 'LIVIANO')" class="service-drop-zone border-2 border-dashed border-slate-500/70 rounded-3xl p-8 md:p-12 flex items-center justify-center cursor-pointer transition-all duration-200 hover:border-cyan-400 hover:bg-cyan-500/20 hover:scale-105 shadow-xl group">
                <span class="text-3xl md:text-5xl font-black tracking-widest text-white group-hover:text-cyan-300 transition-colors">LIVIANO</span>
            </div>
            <div ondragover="permitirDrop(event)" ondragenter="destacarDropZone(this)" ondragleave="desmarcarDropZone(this)" ondrop="ejecutarDropServicio(event, 'PP')" class="service-drop-zone border-2 border-dashed border-slate-500/70 rounded-3xl p-8 md:p-12 flex items-center justify-center cursor-pointer transition-all duration-200 hover:border-cyan-400 hover:bg-cyan-500/20 hover:scale-105 shadow-xl group">
                <span class="text-3xl md:text-5xl font-black tracking-widest text-white group-hover:text-cyan-300 transition-colors">PP</span>
            </div>
            <div ondragover="permitirDrop(event)" ondragenter="destacarDropZone(this)" ondragleave="desmarcarDropZone(this)" ondrop="ejecutarDropServicio(event, 'TDS')" class="service-drop-zone border-2 border-dashed border-slate-500/70 rounded-3xl p-8 md:p-12 flex items-center justify-center cursor-pointer transition-all duration-200 hover:border-cyan-400 hover:bg-cyan-500/20 hover:scale-105 shadow-xl group">
                <span class="text-3xl md:text-5xl font-black tracking-widest text-white group-hover:text-cyan-300 transition-colors">TDS</span>
            </div>
        </div>
        <button onclick="ocultarServiceOverlay()" class="mt-6 px-6 py-2.5 rounded-2xl bg-slate-800 text-slate-300 hover:bg-rose-600 hover:text-white font-black text-xs uppercase tracking-widest transition-all cursor-pointer shadow-md">Cancelar</button>
    </div>

    <!-- MODAL REPORTAR NOVEDAD (DOBLE INSTANCIA + CALENDARIO DESPLEGADO) -->
    <div id="modal-nueva" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-[100] hidden flex flex-col justify-end transition-opacity opacity-0 duration-200">
        <div class="bg-white dark:bg-slate-900 w-full md:w-[500px] md:mx-auto md:mb-6 rounded-t-3xl md:rounded-3xl shadow-2xl transform translate-y-full transition-transform duration-250 ease-out max-h-[90vh] flex flex-col border border-slate-200/80 dark:border-slate-800/80 overflow-hidden" id="modal-content">
            
            <!-- PASO 1 / INSTANCIA 1: SELECCIÓN DE CLASIFICACIÓN -->
            <div id="modal-paso-1" class="flex flex-col flex-1 overflow-hidden">
                <div class="flex justify-between items-center p-5 border-b border-slate-100 dark:border-slate-800 shrink-0">
                    <div>
                        <h2 class="text-xl font-black text-slate-900 dark:text-white">Reportar novedad</h2>
                        <p class="text-xs font-bold text-slate-400 dark:text-slate-500 mt-0.5">Seleccione la clasificación principal para comenzar.</p>
                    </div>
                    <button type="button" onclick="cerrarModalNueva()" class="p-2 bg-slate-100 dark:bg-slate-800 text-slate-400 hover:text-slate-700 dark:hover:text-white rounded-xl transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
                </div>
                
                <div class="p-5 grid grid-cols-2 gap-3.5 overflow-y-auto custom-scrollbar max-h-[70vh]">
                    <button type="button" onclick="seleccionarClasificacionPaso1('LIBRES')" class="h-20 rounded-2xl bg-[#00FFFF] text-black font-black p-4 flex items-center justify-start transition-all hover:scale-[1.02] active:scale-[0.98] shadow-sm relative group overflow-hidden">
                        <span class="text-sm font-black text-left leading-tight">Libres</span>
                    </button>
                    <button type="button" onclick="seleccionarClasificacionPaso1('CERTIFICACION_UNIDAD')" class="h-20 rounded-2xl bg-[#FFAE42] text-slate-950 font-black p-4 flex items-center justify-start transition-all hover:scale-[1.02] active:scale-[0.98] shadow-sm relative group overflow-hidden">
                        <span class="text-sm font-black text-left leading-tight">Certificación de unidad</span>
                    </button>
                    <button type="button" onclick="seleccionarClasificacionPaso1('REPARACION')" class="h-20 rounded-2xl bg-[#6366F1] text-white font-black p-4 flex items-center justify-start transition-all hover:scale-[1.02] active:scale-[0.98] shadow-sm relative group overflow-hidden">
                        <span class="text-sm font-black text-left leading-tight">Reparaciones requeridas</span>
                    </button>
                    <button type="button" onclick="seleccionarClasificacionPaso1('BAJA_DIAGRAMA')" class="h-20 rounded-2xl bg-[#EF4444] text-white font-black p-4 flex items-center justify-start transition-all hover:scale-[1.02] active:scale-[0.98] shadow-sm relative group overflow-hidden">
                        <span class="text-sm font-black text-left leading-tight">Baja / Término diagrama</span>
                    </button>
                    <button type="button" onclick="seleccionarClasificacionPaso1('ESTADO_DEMORA')" class="h-20 rounded-2xl bg-[#D28976] text-white font-black p-4 flex items-center justify-start transition-all hover:scale-[1.02] active:scale-[0.98] shadow-sm relative group overflow-hidden">
                        <span class="text-sm font-black text-left leading-tight">Estado / Demora</span>
                    </button>
                    <button type="button" onclick="seleccionarClasificacionPaso1('EXAMEN_CHOFER')" class="h-20 rounded-2xl bg-[#10B981] text-white font-black p-4 flex items-center justify-start transition-all hover:scale-[1.02] active:scale-[0.98] shadow-sm relative group overflow-hidden">
                        <span class="text-sm font-black text-left leading-tight">Exámenes / Vencimientos</span>
                    </button>
                </div>
            </div>

            <!-- PASO 2 / INSTANCIA 2: FORMULARIO DE NOVEDAD -->
            <div id="modal-paso-2" class="hidden flex-col flex-1 overflow-hidden">
                <!-- TOP BAR ADAPTATIVA SE GÚN CLASIFICACIÓN -->
                <div id="modal-paso-2-header" class="flex justify-between items-center p-4 transition-colors duration-300 text-white shrink-0 bg-[#6366F1]">
                    <button type="button" onclick="volverPaso1Modal()" class="p-1.5 hover:bg-black/10 rounded-xl transition-colors flex items-center gap-1 font-extrabold text-xs" title="Volver a clasificaciones">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    </button>
                    <h2 id="modal-paso-2-titulo" class="text-sm font-black uppercase tracking-wide text-center truncate mx-2">Reportar Novedad</h2>
                    <button type="button" onclick="cerrarModalNueva()" class="p-1.5 hover:bg-black/10 rounded-xl transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>

                <form onsubmit="enviarNovedad(event)" class="p-5 flex-1 overflow-y-auto flex flex-col gap-4 custom-scrollbar">
                    <input type="hidden" id="input-edit-id">
                    <input type="hidden" id="input-tipo">

                    <div class="relative">
                        <label class="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-1.5 block">Buscar Conductor</label>
                        <input type="text" id="input-nom" placeholder="Escriba nombre o tractor..." class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl p-3 text-sm font-bold text-slate-800 dark:text-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none uppercase shadow-sm transition-all" autocomplete="off" oninput="filtrarChoferes('nom')" onfocus="filtrarChoferes('nom')" required>
                        <div id="dropdown-choferes" class="hidden absolute z-50 w-full mt-1 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-2xl max-h-60 overflow-y-auto custom-scrollbar"></div>
                    </div>
                    
                    <input type="hidden" id="input-ute">
                    
                    <div class="grid grid-cols-2 gap-3">
                        <div class="relative">
                            <label class="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-1.5 block">Tractor</label>
                            <input type="text" id="input-tractor" placeholder="Dominio" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl p-3 text-sm font-bold text-slate-800 dark:text-slate-200 uppercase outline-none focus:ring-2 focus:ring-indigo-500 transition-all" autocomplete="off" oninput="filtrarChoferes('tractor')" onfocus="filtrarChoferes('tractor')">
                            <div id="dropdown-tractores" class="hidden absolute z-50 w-full mt-1 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-2xl max-h-60 overflow-y-auto custom-scrollbar"></div>
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-1.5 block">Servicio</label>
                            <input type="text" id="input-srv" class="w-full bg-slate-200 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl p-3 text-sm font-black text-slate-700 dark:text-slate-300 outline-none text-center uppercase cursor-default opacity-90 select-none shadow-inner" readonly value="S/A">
                        </div>
                    </div>

                    <!-- 🏢 SELECCIÓN DE TERMINAL (TOGGLE BUTTON UNIQUE) -->
                    <div id="div-terminal" class="flex flex-col gap-1.5 py-1">
                        <input type="hidden" id="input-terminal" value="">
                        <div class="flex items-center gap-4 flex-wrap">
                            <label onclick="seleccionarTerminal('DOCK SUD')" class="flex items-center gap-2 cursor-pointer group select-none">
                                <div id="radio-terminal-DOCK SUD" class="w-5 h-5 rounded-full border-2 border-slate-400 dark:border-slate-600 flex items-center justify-center transition-all bg-white dark:bg-slate-900 group-hover:border-indigo-500">
                                    <div class="w-2.5 h-2.5 rounded-full bg-slate-900 dark:bg-slate-100 hidden"></div>
                                </div>
                                <span class="text-xs font-black text-slate-800 dark:text-slate-200 uppercase tracking-wide">DOCK SUD</span>
                            </label>

                            <label onclick="seleccionarTerminal('TPH')" class="flex items-center gap-2 cursor-pointer group select-none">
                                <div id="radio-terminal-TPH" class="w-5 h-5 rounded-full border-2 border-slate-400 dark:border-slate-600 flex items-center justify-center transition-all bg-white dark:bg-slate-900 group-hover:border-indigo-500">
                                    <div class="w-2.5 h-2.5 rounded-full bg-slate-900 dark:bg-slate-100 hidden"></div>
                                </div>
                                <span class="text-xs font-black text-slate-800 dark:text-slate-200 uppercase tracking-wide">TPH</span>
                            </label>

                            <label onclick="seleccionarTerminal('AÑELO')" class="flex items-center gap-2 cursor-pointer group select-none">

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        // 👉 INICIALIZACIÓN MODO OSCURO & VISTA SÓLIDA
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.getElementById('icon-moon')?.classList.add('hidden');
            document.getElementById('icon-sun')?.classList.remove('hidden');
        } else {
            document.documentElement.classList.remove('dark');
        }

        if (localStorage.getItem('modo_cartelera') === 'true' || localStorage.getItem('vista_solida') === 'true') {
            document.documentElement.classList.add('modo-cartelera');
            document.documentElement.classList.add('vista-solida');
        }

        function updateCarteleraUI(isCartelera) {
            const dot = document.getElementById('dot-cartelera') || document.getElementById('dot-vista-solida');
            const btn = document.getElementById('btn-cartelera') || document.getElementById('btn-vista-solida');
            if (dot) {
                dot.className = isCartelera ? 'w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-sm shadow-emerald-500/50' : 'w-2.5 h-2.5 rounded-full bg-slate-400';
            }
            if (btn) {
                if (isCartelera) {
                    btn.classList.add('border-emerald-500/50', 'text-emerald-600', 'dark:text-emerald-400');
                } else {
                    btn.classList.remove('border-emerald-500/50', 'text-emerald-600', 'dark:text-emerald-400');
                }
            }
        }

        function toggleCartelera() {
            const html = document.documentElement;
            const isCartelera = html.classList.toggle('modo-cartelera');
            html.classList.toggle('vista-solida', isCartelera);
            localStorage.setItem('modo_cartelera', isCartelera ? 'true' : 'false');
            localStorage.setItem('vista_solida', isCartelera ? 'true' : 'false');
            updateCarteleraUI(isCartelera);
            if (typeof renderizar === 'function') renderizar();
        }

        function updateVistaSolidaUI(isSolida) { updateCarteleraUI(isSolida); }
        function toggleVistaSolida() { toggleCartelera(); }

        function toggleDarkMode() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            
            document.getElementById('icon-moon')?.classList.toggle('hidden', isDark);
            document.getElementById('icon-sun')?.classList.toggle('hidden', !isDark);
        }

        function actualizarRelojArgentina() {
            const clockEl = document.getElementById('clock-argentina');
            if (!clockEl) return;
            try {
                const ahora = new Date();
                const formatter = new Intl.DateTimeFormat('es-AR', {
                    timeZone: 'America/Argentina/Buenos_Aires',
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false
                });
                clockEl.innerText = formatter.format(ahora);
            } catch(e) {
                const ahora = new Date();
                const hh = String(ahora.getHours()).padStart(2, '0');
                const mm = String(ahora.getMinutes()).padStart(2, '0');
                clockEl.innerText = `${hh}:${mm}`;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateVistaSolidaUI(document.documentElement.classList.contains('vista-solida'));
            actualizarRelojArgentina();
            setInterval(actualizarRelojArgentina, 1000);
        });
    </script>
    
    <!-- Carga ordenada de módulos para escalabilidad -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/feed.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/socket.js"></script>
